<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Log Clinic - Agenda de Consultas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div id="sistema-completo">

    <header class="navbar">
        <div class="logo"><img src="assets/imagens/LOGO.png" alt="Log Clinic"></div>
        <div class="usuario">
            Olá, <span id="nome-usuario-logado">Admin</span> | 
            <a href="login.html" id="btn-sair" style="color: #94a3b8; text-decoration: none; margin-left: 5px;">
                <i class="fa-solid fa-power-off"></i> Sair
            </a>
        </div> 
    </header>

    <div class="container-principal">
        
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="index.html" ><i class="fa-solid fa-house"></i> Início</a></li>
                    <li><a href="pacientes.html"><i class="fa-solid fa-user-injured"></i> Pacientes</a></li>
                    <li><a href="agenda.html" class="active-link"><i class="fa-solid fa-calendar-days"></i> Agenda</a></li>
                    <li><a href="ledger.html"><i class="fa-solid fa-book-medical"></i> Ledger</a></li>
                    <li><a href="financeiro.html"><i class="fa-solid fa-file-invoice-dollar"></i> Financeiro</a></li>
                    <li><a href="estoque.html"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a></li>
                    <li><a href="relatorios.html"><i class="fa-solid fa-chart-line"></i> Relatórios</a></li>
                    <li><a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo-central">
            
            <section id="tela-agenda" class="secao-conteudo">
                <div class="titulo-secao">
                    <h2>Agenda de Consultas</h2>
                    <p>Gerencie os horários, marcações e compromissos clínicos da equipa médica.</p>
                </div>

                <div class="barra-acoes">
                    <div class="campo-busca" style="display: flex; gap: 10px; max-width: 200px;">
                        <input type="date" id="filtro-data-agenda"
                            style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;">
                        
                            <button class="btn-primario" style="padding: 12px 20px;" title="Filtrar Data">
                                Filtrar
                            </button>
                    </div>
                    <button class="btn-primario" onclick="location.href='cadastro-agenda.html'">
                        <i class="fa-solid fa-calendar-plus"></i> Novo Agendamento
                    </button>
                </div>

                <div class="container-tabela">
                    <table class="tabela-sistema">
                        <thead>
                            <tr>
                                <th style="width: 15%;">Data / Hora</th>
                                <th style="width: 40%;">Paciente</th>
                                <th style="width: 30%;">Procedimento / Serviço</th>
                                <th style="width: 15%; text-align: right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-agenda-corpo">
                            <tr>                           
                            <!-- Linhas de agendamento serão inseridas aqui dinamicamente via JavaScript -->
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>
</div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/lista-agenda.js"></script>
</body>
</html>
