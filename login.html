<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Log Clinic - Acesso ao Sistema</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">

    <div id="tela-login" class="login-container">
        <div class="login-box">
            <img src="assets/imagens/LOGO2.png" alt="Log Clinic" class="logo-login" style="width: 300px; margin-bottom: 20px;">
            <p>Identifique-se para acessar o sistema</p>
            
            <form id="form-login">
                <div class="campo-login">
                    <label for="login-usuario">Usuário</label>
                    <input type="text" id="login-usuario" required placeholder="Digite seu usuário" style="text-transform: lowercase">
                </div>
                <div class="campo-login">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" required placeholder="Digite sua senha">
                </div>
                <button type="submit" class="btn-acesso">Acessar Sistema</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
        
</body>
</html>
