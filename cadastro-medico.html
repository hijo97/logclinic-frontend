<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Log Clinic - Configurações :: Cadastramento de Médicos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div id="sistema-completo">
    <header class="navbar">
        <div class="logo"><img src="assets/imagens/LOGO.png" alt="Log Clinic"></div>
        <div class="usuario">Olá, <span id="nome-usuario-logado">Admin</span> | <a href="login.html" id="btn-sair" style="color: #94a3b8; text-decoration: none; margin-left: 5px;"><i class="fa-solid fa-power-off"></i> Sair</a></div> 
    </header>

    <div class="container-principal">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="index.html" ><i class="fa-solid fa-house"></i> Início</a></li>
                    <li><a href="pacientes.html"><i class="fa-solid fa-user-injured"></i> Pacientes</a></li>
                    <li><a href="agenda.html" ><i class="fa-solid fa-calendar-days"></i> Agenda</a></li>
                    <li><a href="ledger.html"><i class="fa-solid fa-book-medical"></i> Ledger</a></li>
                    <li><a href="financeiro.html"><i class="fa-solid fa-file-invoice-dollar"></i> Financeiro</a></li>
                    <li><a href="estoque.html"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a></li>
                    <li><a href="relatorios.html"><i class="fa-solid fa-chart-line"></i> Relatórios</a></li>
                    <li><a href="configuracoes.html" class="active-link"><i class="fa-solid fa-gear"></i> Configurações</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo-central">
            <section id="tela-configuracoes" class="secao-conteudo">
                <div class="titulo-secao">
                    <h2>Cadastro de Médicos</h2>
                    <p>Gerencie os Médicos com suas especialidades de atendimento.</p>
                </div>

                <div class="container-tabela" style="padding: 25px; margin-bottom: 30px;">
                    <h3 style="margin: 0 0 20px 0; color: #1e293b;"><i class="fa-solid fa-users-gear"></i> Novo Médico</h3>
                   <form id="form-cadastro-medico" class="formulario-sistema">
                        <div class="grupo-campos">
                            <div class="campo-form largura-50">
                                <label for="med-nome">Nome Completo *</label>
                                <input type="text" id="med-nome" required placeholder="Ex: DR. CARLOS DA SILVA" style="text-transform: uppercase;">
                            </div>
                        
                            <div class="campo-form largura-50">
                                <label for="med-crm">CRM *</label>
                                <input type="text" id="med-crm" required placeholder="Ex: 123456">
                            </div>
                                                   
                            <div class="campo-form largura-50">
                                <label for="med-uf">UF do CRM *</label>
                                <select id="med-uf" required class="input-padrao">
                                    <option value="">Selecione...</option>
                                    <option value="SP">SP</option>
                                    <option value="RJ">RJ</option>
                                    <option value="MG">MG</option>
                                    </select>
                            </div>
                          
                            <div class="campo-form largura-50">
                                <label for="med-especialidade">Especialidade *</label>
                                <input type="text" id="med-especialidade" required placeholder="Ex: CLINICO GERAL" style="text-transform: uppercase;">
                            </div>
                        </div>
                        <div class="grupo-campos" style="margin-top: 15px;">
                            <div class="campo-form largura-50">
                                <label for="med-telefone">Telefone/WhatsApp *</label>
                                <input type="tel" id="med-telefone" required placeholder="(11) 99999-0000" maxlength="15">
                            </div>
                        </div>
                       
                        <div class = "botoes-formulario" style = "margin-top: 20px;">
                           <button type="button" class="btn-secundario" onclick="location.href='configuracoes.html'">
                                Cancelar
                           </button>
                       
                            <button type="submit" class="btn-primario" style="margin-top: 20px;"><i class="fa-solid fa-user-plus"></i> 
                                Adicionar Médico
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cadastro-medico.js"></script>
</body>
</html>
