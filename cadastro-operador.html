<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Log Clinic - Configurações :: Gerenciamento de Usuário</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div id="sistema-completo">
    <header class="navbar">
        <div class="logo"><img src="assets/imagens/LOGO.png" alt="Log Clinic"></div>
        <div class="usuario">Olá, <span id="nome-usuario-logado">Admin</span> | <a href="login.html" id="btn-sair" style="color: #94a3b8; text-decoration: none; margin-left: 5px;"><i class="fa-solid fa-power-off"></i> Sair</a></div> 
    </header>

    <div class="container-principal">
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="index.html" ><i class="fa-solid fa-house"></i> Início</a></li>
                    <li><a href="pacientes.html"><i class="fa-solid fa-user-injured"></i> Pacientes</a></li>
                    <li><a href="agenda.html" ><i class="fa-solid fa-calendar-days"></i> Agenda</a></li>
                    <li><a href="ledger.html"><i class="fa-solid fa-book-medical"></i> Ledger</a></li>
                    <li><a href="financeiro.html"><i class="fa-solid fa-file-invoice-dollar"></i> Financeiro</a></li>
                    <li><a href="estoque.html"><i class="fa-solid fa-boxes-stacked"></i> Estoque</a></li>
                    <li><a href="relatorios.html"><i class="fa-solid fa-chart-line"></i> Relatórios</a></li>
                    <li><a href="configuracoes.html" class="active-link"><i class="fa-solid fa-gear"></i> Configurações</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo-central">
            <section id="tela-cadastro-operador" class="secao-conteudo">
                <div class="titulo-secao">
                    <h2>Configurações do Sistema</h2>
                    <p>Gerencie as definições da clínica e perfis de acesso dos utilizadores.</p>
                </div>

                <div class="container-tabela" style="padding: 25px; margin-bottom: 30px;">
                    <h3 style="margin: 0 0 20px 0; color: #1e293b;"><i class="fa-solid fa-users-gear"></i> Novo Utilizador</h3>
                    <form id="form-cadastro-operador" class="formulario-sistema">
                        <div class="grupo-campos">
                          
                            <div class="campo-form largura-50">
                                <label for="usu-nome">Nome Completo *</label>
                                <input type="text" id="usu-nome" required placeholder="Ex: Ana Souza" width="50%">
                            </div>
                        
                            <div class="campo-form largura-50">
                                <label for="usu-cpf">CPF *</label>
                                <input type="text" id="usu-cpf" required placeholder="Ex:123.123.123-45">
                            </div>
          
                            <div class="campo-form largura-50">
                                <label for="usu-setor">Setor *</label>
                                <select id="usu-setor" required style="width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px;">
                                    <option value="">Selecione...</option>
                                    <option value="ADMIN">Administração</option>
                                    <option value="RECEPCAO">Recepção</option>
                                    <option value="FINANCE">Financeiro</option>
                                    <option value="MEDICO">Médico</option>
                                    <option value="ENFERMARIA">Enfermaria</option>
                                    <option value="TI">TI</option>    
                                </select>
                            </div>
                          
                            <div class="campo-form largura-50">
                                <label for="usu-login">Usuário (Login) *</label>
                                <input type="text" id="usu-login" style="text-transform: lowercase;" required placeholder="Ex: ana.souza">
                            </div>
                        </div>
          
                        <div class="grupo-campos" style="margin-top: 15px;">
                            <div class="campo-form largura-50">
                                <label for="usu-senha">Senha de Acesso *</label>
                                <input type="password" id="usu-senha" required placeholder="Digite a senha">
                            </div>
                            <div class="campo-form largura-50">
                                <label for="usu-perfil">Nível de Permissão *</label>
                                <select id="usu-perfil" required style="width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px;">
                                    <option value="">Selecione...</option>
                                    <option value="ADMIN">ADMIN (Acesso Total)</option>
                                    <option value="RECEPCAO">RECEPCAO</option>
                                    
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-primario" style="margin-top: 20px;"><i class="fa-solid fa-user-plus"></i> Adicionar Utilizador</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
</div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cadastro-operador.js"></script>
</body>
</html>
